# Pre-commit hooks for the Python BANKDATA utility. The Java/CICS sources are
# intentionally out of scope: this sample's Java build is Maven's job.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types: [python]
      - id: end-of-file-fixer
        types: [python]
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
        types: [python]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(bankdata_setup\.py|tests/)
      - id: ruff-format
        files: ^(bankdata_setup\.py|tests/)

  # Use the project's uv-managed toolchain so hook and CI versions stay aligned.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
